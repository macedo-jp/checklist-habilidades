{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Cadastrar Novo Paciente</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Criança</label>
                        <input type="text" name="nome" id="nome" class="form-control" placeholder="Ex: Joãozinho" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="nascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" name="nascimento" id="nascimento" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="psicologo" class="form-label">Psicólogo(a) Responsável</label>
                        <input type="text" name="psicologo" id="psicologo" class="form-control" placeholder="Nome do profissional">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Salvar Cadastro</button>
                        <a href="{{ url_for('index') }}" class="btn btn-light">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
