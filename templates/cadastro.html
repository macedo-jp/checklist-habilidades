{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <a href="/" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h2 class="text-2xl font-bold text-gray-900">{{ 'Editar' if aprendiz else 'Novo' }} Aprendiz</h2>
                <p class="text-sm text-gray-500">Preencha as informações clínicas e de contato do paciente.</p>
            </div>
        </div>
    </div>

    <form method="POST" class="space-y-8">

        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex items-center">
                <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center mr-3">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <h3 class="font-bold text-gray-900">Dados Pessoais</h3>
            </div>
            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Nome Completo</label>
                    <input type="text" name="nome" value="{{ aprendiz.nome if aprendiz else '' }}" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" value="{{ aprendiz.data_nascimento if aprendiz else '' }}" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">CPF</label>
                    <input type="text" id="cpf-input" name="cpf" value="{{ aprendiz.cpf if aprendiz else '' }}" required placeholder="000.000.000-00" maxlength="14" oninput="this.value = this.value.replace(/[^0-9.-]/g, '')" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">CID (Código de Diagnóstico)</label>
                    <input type="text" name="cid" value="{{ aprendiz.cid if aprendiz else '' }}" placeholder="Ex: F84.0" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">URL da Foto</label>
                    <input type="url" name="foto_url" value="{{ aprendiz.foto_url if aprendiz else '' }}" placeholder="https://exemplo.com/foto.jpg" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
            </div>
        </div>


        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex items-center">
                <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center mr-3">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                </div>
                <h3 class="font-bold text-gray-1000">Informações do Responsável</h3>
            </div>
            <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Nome do Responsável</label>
                    <input type="text" name="nome_responsavel" value="{{ aprendiz.nome_responsavel if aprendiz else '' }}" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Telefone</label>
                    <input type="tel" name="telefone_responsavel" value="{{ aprendiz.telefone_responsavel if aprendiz else '' }}" required placeholder="(00) 00000-0000" maxlength="15" oninput="this.value = this.value.replace(/\D/g, '').replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d+)(\d{4})$/, '$1-$2').substring(0, 15);" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">E-mail</label>
                    <input type="email" name="email_responsavel" value="{{ aprendiz.email_responsavel if aprendiz else '' }}" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all" />
                </div>
            </div>
        </div>


        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex items-center">
                <div class="w-8 h-8 rounded-lg bg-green-100 text-green-600 flex items-center justify-center mr-3">
                    <i data-lucide="stethoscope" class="w-4 h-4"></i>
                </div>
                <h3 class="font-bold text-gray-900">Vínculo Clínico</h3>
            </div>
            <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Terapeuta Responsável</label>
                    <select name="terapeuta_id" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all">
                        <option value="">Selecione um terapeuta</option>
                        {% for t in terapeutas %}
                        <option value="{{ t.id }}" {{ 'selected' if aprendiz and aprendiz.terapeuta_id == t.id else '' }}>{{ t.nome }} ({{ t.especialidade }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">Status Inicial</label>
                    <select name="status" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:border-blue-500 focus:ring-0 transition-all">
                        <option value="Avaliação" {{ 'selected' if aprendiz and aprendiz.status == 'Avaliação' else '' }}>Avaliação</option>
                        <option value="Em Andamento" {{ 'selected' if aprendiz and aprendiz.status == 'Em Andamento' else '' }}>Em Andamento</option>
                        <option value="Estável" {{ 'selected' if aprendiz and aprendiz.status == 'Estável' else '' }}>Estável</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end space-x-4 pt-4">
            <a href="/" class="px-6 py-2 text-sm font-bold text-gray-500 hover:text-gray-700 transition-all">Cancelar</a>
            <button type="submit" class="inline-flex items-center px-8 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
                <i data-lucide="save" class="w-4 h-4 mr-2"></i>
                Salvar Registro
            </button>
        </div>
    </form>
</div>

<script>
    const cpfInput = document.getElementById('cpf-input');
    if (cpfInput) {
        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 9) {
                value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/^(\d{3})(\d{0,3}).*/, '$1.$2');
            }
            
            e.target.value = value;
        });
    }
</script>
{% endblock %}
